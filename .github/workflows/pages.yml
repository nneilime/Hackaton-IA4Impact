name: pages

on:
  push:
    branches: [main]
    paths:
      - "team-app/front/**"
      - "team-app/scripts/build-front.js"
      - "team-app/package.json"
      - "team-app/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: team-app/package-lock.json
      - name: Installer les dépendances
        working-directory: team-app
        run: npm ci
      - name: Minifier le front
        working-directory: team-app
        run: npm run build:front
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: team-app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
