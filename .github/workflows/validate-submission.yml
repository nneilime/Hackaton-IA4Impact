name: validate-submission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    name: validate-submission
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le périmètre du dépôt
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Registre des équipes (lecture depuis la branche de base)
            let teams = [];
            try {
              const res = await github.rest.repos.getContent({
                owner, repo, path: 'teams.json', ref: pr.base.ref
              });
              const raw = Buffer.from(res.data.content, 'base64').toString('utf8');
              teams = (JSON.parse(raw).teams) || [];
            } catch (e) {
              teams = [];
            }

            const team = teams.find(t =>
              (t.members || [])
                .map(m => (typeof m === 'string' ? m : m.login))
                .filter(Boolean)
                .some(l => String(l).toLowerCase() === author.toLowerCase())
            );
            const allowedRoot = team
              ? `submissions/${team.slug}/`
              : `submissions/${author}/`;
            const allowed = allowedRoot.toLowerCase();

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });

            if (files.length === 0) {
              core.setFailed('Aucun fichier dans cette Pull Request.');
              return;
            }

            const names = files.map(f => f.filename);
            const offenders = names.filter(f => !f.toLowerCase().startsWith(allowed));

            if (offenders.length > 0) {
              core.setFailed(
                `⛔ Dépôt hors périmètre.\n` +
                `Dossier autorisé : ${allowedRoot}\n\n` +
                `Fichiers refusés :\n - ` + offenders.join('\n - ')
              );
              return;
            }

            // Contrôle indicatif : un README de projet est attendu dans le dossier
            if (!names.some(f => f.toLowerCase() === `${allowed}readme.md`)) {
              core.warning(`Pensez à ajouter un README.md dans ${allowedRoot} (voir submissions/_template/).`);
            }

            core.info(`✅ Dépôt autorisé : ${allowedRoot}`);
