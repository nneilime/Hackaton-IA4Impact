# Paramètres de configuration de la simulation de crise électrique

simulation:
  # Durée d'un pas de temps (en minutes)
  pas_de_temps_min: 30
  # Nombre maximum de pas de temps (T1 -> T5 étendu, soit 48h avec pas de 30 min)
  nb_pas_max: 96

geo:
  # Coefficient de détour appliqué à la distance Haversine (vol d'oiseau → route réelle)
  # 1.3 = +30% par rapport à la distance à vol d'oiseau (valeur standard France)
  coeff_detour: 1.3
  # Vitesse moyenne des véhicules d'intervention (km/h)
  vitesse_moyenne_kmh: 60.0

priorite:
  # Pondérations de la fonction de score pour l'affectation.
  # En plus, toutes les stratégies appliquent une priorité absolue aux lieux sensibles :
  # ce poids ne départage plus que les incidents d'un même groupe (sensibles / non sensibles).
  poids_clients_impactes: 0.40
  poids_clients_sensibles: 0.35
  poids_duree_depannage: 0.15
  poids_distance: 0.10

penalites:
  # Malus appliqué si aucun agent n'est affecté à un incident critique (clients sensibles > seuil)
  seuil_clients_sensibles: 5
  malus_incident_non_couvert: 1000.0

agents:
  # Durée maximale de travail continu avant pause obligatoire (en heures) — règle 12h/11h
  duree_max_travail_h: 12
  # Durée minimale de repos (en heures) — règle 12h/11h
  duree_min_repos_h: 11
