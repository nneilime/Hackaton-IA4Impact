[pytest]
# `pytest -q` à la racine ne lance que tests/ : les deux dossiers backend/etl/adapters/*/tests contiennent chacun
# un test_service.py (même nom, pas de __init__.py) et se bloquent mutuellement à la collecte.
# Leurs tests restent lançables un par un : pytest backend/etl/adapters/france/tests
testpaths = tests
