[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crise"
version = "0.1.0"
description = "Copilote de crise Enedis — Hackathon IA for Impact 2026 (La Mêlée)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "pyyaml>=6",
    "scipy>=1.12",
    "ortools>=9.10",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.35",
    "folium>=0.16",
    "streamlit-folium>=0.20",
    "plotly>=5.20",
    "ollama>=0.3",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["explorations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
